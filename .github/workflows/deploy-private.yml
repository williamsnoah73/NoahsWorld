name: Validate and deploy private family site

on:
  push:
    branches: [main]
    paths:
      - 'private-site/**'
      - 'src/components/**'
      - 'src/styles/**'
      - 'astro.private.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-private.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: private-family-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: private-family-site
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:private
      - name: Deploy private site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-private --project-name=noahs-world-family --branch=main
